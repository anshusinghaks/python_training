<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <h1>Forms</h1>

    <div>
        
        <form action="">

             <br><br>

            <input type="number" id="phonenumber" required min="0">

            <label for="gender">Gender :</label>

            <input type="Submit">

            
            </form>
        
    </div>
